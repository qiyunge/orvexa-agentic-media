services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-orvexa}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-orvexa}
  
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - data-network

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - data-network

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5-community}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins
      - neo4j-import:/import
    healthcheck:
      test:
        [ "CMD-SHELL", "curl -f http://localhost:7474/db/data/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - data-network

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --health-check-timeout 5s ping" ]
      interval: 10s
      timeout: 5s

    command:
      - /bin/sh
      - -c
      - >
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --requirepass "$${REDIS_PASSWORD}"


volumes:
  postgres-data:
  qdrant-data:
  neo4j-data:
  neo4j-logs:
  neo4j-plugins:
  neo4j-import:
  redis-data:
  
networks:
  data-network:
    external: true
    name: orvexa-data-network