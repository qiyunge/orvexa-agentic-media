[project]
name = "rag-index-service"
version = "0.1.0"
description = "Stateless document indexing service for Orvexa RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]


[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select =["E","F","I"]
